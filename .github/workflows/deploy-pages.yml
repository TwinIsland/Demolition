# Builds the game and the wiki and publishes them to GitHub Pages on every push to main.
# Requires Settings > Pages > Source to be set to "GitHub Actions".
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces a deployment that is still in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      # The game uses relative paths; the wiki is built for /Demolition/wiki/.
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
