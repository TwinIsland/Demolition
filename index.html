<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#131b1d" />
    <meta name="description" content="A first-person 3D demolition arena for up to four players." />
    <title>Demolition Front</title>
    <link rel="stylesheet" href="/assets/fonts/fonts.css" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/ui/loading.css" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
  </head>
  <body>
    <div id="app" inert></div>
    <section id="loading-screen" data-stage="startup" aria-label="Loading assets">
      <canvas class="loading-map" aria-hidden="true" hidden></canvas>
      <div class="loading-panel">
        <img class="loading-insignia" src="/assets/menu/insignia.png" width="60" height="60" alt="" />
        <h1 class="loading-title">Demolition Front</h1>
        <div class="loading-status" role="status"><span>Loading</span><output></output></div>
        <progress aria-label="Asset loading progress"></progress>
        <p class="loading-item">Loading Modules…</p>
        <button class="loading-retry" hidden>Retry</button>
      </div>
    </section>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
