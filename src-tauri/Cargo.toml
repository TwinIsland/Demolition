[package]
name = "demolition"
version = "1.0.0"
description = "Demolition desktop shell"
edition = "2021"

[lib]
name = "demolition_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }

# The shell is a thin window around the web build, so favour a small binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
